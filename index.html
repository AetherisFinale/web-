<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=./Aetheris%20Finale-website/">
    <title>Aetheris Finale 宙光祭</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loading-box {
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 102, 0, 0.2);
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #ff6600;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // 瞬間跳轉至官網頁面
        window.location.replace("./Aetheris%20Finale-website/");
    </script>
</head>
<body>
    <div class="loading-box">
        <div class="spinner"></div>
        <p>正在前往 Aetheris Finale 宙光祭...</p>
        <p style="font-size: 0.85em; color: #888;">若未自動跳轉，請<a href="./Aetheris%20Finale-website/">點此直接進入</a></p>
    </div>
</body>
</html>
